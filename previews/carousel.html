<script>
var car=document.getElementById('carousel'),bs=document.querySelectorAll('[data-car]');
function st(){var max=car.scrollWidth-car.clientWidth-2;bs[0].disabled=car.scrollLeft<=2;bs[1].disabled=car.scrollLeft>=max;bs[0].parentNode.style.visibility=max<=2?'hidden':'';}

</script>
